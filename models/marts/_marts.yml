version: 2
models:
  - name: dim_customers
    config:
      contract:
        enforced: true
    columns:
      - name: customer_unique_id
        data_type: varchar
        tests: [not_null, unique]
      - name: customer_city
        data_type: varchar
      - name: customer_state
        data_type: varchar
      - name: customer_zip_code_prefix
        data_type: varchar
  - name: dim_products
    config:
      contract:
        enforced: true
    columns:
      - name: product_id
        data_type: varchar
        tests: [not_null, unique]
      - name: product_category_name
        data_type: varchar
      - name: product_category_name_english
        data_type: varchar
      - name: product_name_length
        data_type: integer
      - name: product_description_length
        data_type: integer
      - name: product_photos_qty
        data_type: integer
      - name: product_weight_g
        data_type: integer
      - name: product_length_cm
        data_type: integer
      - name: product_height_cm
        data_type: integer
      - name: product_width_cm
        data_type: integer
  - name: dim_sellers
    config:
      contract:
        enforced: true
    columns:
      - name: seller_id
        data_type: varchar
        tests: [not_null, unique]
      - name: seller_city
        data_type: varchar
      - name: seller_state
        data_type: varchar
      - name: seller_zip_code_prefix
        data_type: varchar
  - name: dim_date
    config:
      contract:
        enforced: true
    columns:
      - name: date_day
        data_type: date
        tests: [not_null, unique]
      - name: year
        data_type: bigint
      - name: month
        data_type: bigint
      - name: day
        data_type: bigint
      - name: year_month
        data_type: varchar
      - name: month_start
        data_type: date
  - name: fact_orders
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: varchar
        tests: [not_null, unique]
      - name: customer_unique_id
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_status
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable',
                       'invoiced', 'processing', 'created', 'approved']
      - name: order_purchase_timestamp
        data_type: timestamp
      - name: order_date
        data_type: date
      - name: delivered_date
        data_type: date
      - name: days_to_deliver
        data_type: bigint
      - name: item_count
        data_type: bigint
      - name: items_value
        data_type: double
      - name: freight_value
        data_type: double
      - name: payment_value
        data_type: double
  - name: fact_order_items
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: order_item_id
        data_type: integer
      - name: product_id
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: customer_unique_id
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_date
        data_type: date
      - name: price
        data_type: double
      - name: freight_value
        data_type: double
