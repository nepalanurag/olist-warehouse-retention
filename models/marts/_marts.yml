version: 2
models:
  - name: dim_customers
    columns:
      - name: customer_unique_id
        tests: [not_null, unique]
  - name: dim_products
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: dim_sellers
    columns:
      - name: seller_id
        tests: [not_null, unique]
  - name: dim_date
    columns:
      - name: date_day
        tests: [not_null, unique]
  - name: fact_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_unique_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable',
                       'invoiced', 'processing', 'created', 'approved']
  - name: fact_order_items
    columns:
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: customer_unique_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
