version: 2
sources:
  - name: raw_olist
    schema: raw_olist
    description: >
      Views over the raw Olist CSVs as published (see data/SOURCE.md),
      created by scripts/load_raw.py. No cleaning happens at this layer.
    tables:
      - name: customers
      - name: orders
      - name: order_items
      - name: order_payments
      - name: order_reviews
      - name: products
      - name: sellers
      - name: product_category_name_translation
